name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
      - name: Check the tag matches both manifests
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p "require('./package.json').version")"
          test "$version" = "$(node -p "require('./.claude-plugin/plugin.json').version")"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx -y @anthropic-ai/claude-code@2.1.291 plugin validate .
      - run: npx -y @anthropic-ai/claude-code@2.1.291 plugin test .
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
