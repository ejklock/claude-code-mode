name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Check the tag matches both manifests
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p "require('./package.json').version")"
          test "$version" = "$(node -p "require('./.claude-plugin/plugin.json').version")"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx -y @anthropic-ai/claude-code@2.1.291 plugin validate .
      - run: npx -y @anthropic-ai/claude-code@2.1.291 plugin test .
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
